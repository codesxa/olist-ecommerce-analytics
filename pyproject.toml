[project]
name = "olist-ecommerce-analytics"
version = "0.1.0"
description = "Анализ продаж бразильских маркетплейсов"
authors = [
    {name = "codesxa",email = "danilstarovatov@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
